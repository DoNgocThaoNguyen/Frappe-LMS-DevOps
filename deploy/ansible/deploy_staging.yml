---
- name: DACN - Guarded local Staging deployment
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    home_dir: "{{ lookup('env', 'HOME') }}"
    docker_dir: "{{ home_dir }}/DACN/SP2/frappe_docker"
    staging_dir: "{{ home_dir }}/DACN/SP2/staging-local"
    staging_env: "{{ staging_dir }}/staging.env"
    backup_dir: "{{ staging_dir }}/backups/pre-ansible-deploy"
    stable: "{{ lookup('ansible.builtin.file', playbook_dir + '/../last_known_good.json') | from_json }}"
    target: "{{ lookup('ansible.builtin.file', playbook_dir + '/../target_release.json') | from_json }}"
    simulate_failure: false
    compose_base:
      - docker
      - compose
      - -p
      - dacn-staging
      - --env-file
      - "{{ staging_env }}"
      - -f
      - "{{ docker_dir }}/compose.yaml"
      - -f
      - "{{ docker_dir }}/overrides/compose.mariadb.yaml"
      - -f
      - "{{ docker_dir }}/overrides/compose.redis.yaml"
      - -f
      - "{{ staging_dir }}/compose.port.yml"

  tasks:
    - name: Check release metadata
      ansible.builtin.assert:
        that:
          - stable.image is defined
          - stable.digest is defined
          - target.image is defined
          - target.digest is defined
          - target.site == stable.site
          - target.url == stable.url
          - target.image is match('^ghcr[.]io/dongocthaonguyen/dacn-frappe-lms:sha-[a-f0-9]{12}$')
          - target.digest is match('^sha256:[a-f0-9]{64}$')

    - name: Check off-volume backup directory
      ansible.builtin.stat:
        path: "{{ backup_dir }}"
      register: backup_stat

    - name: Require off-volume backup
      ansible.builtin.assert:
        that:
          - backup_stat.stat.isdir | default(false)
        fail_msg: "Create and verify an external backup before deployment."

    - name: Find external database backups
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns: '*-database.sql.gz'
        file_type: file
      register: database_backups

    - name: Require database archive outside Docker volumes
      ansible.builtin.assert:
        that:
          - database_backups.matched | int > 0

    - name: Verify currently deployed stable version
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../validate_deployment.py"
          - --expected-image
          - "{{ stable.image }}"
          - --expected-digest
          - "{{ stable.digest }}"
          - --site
          - "{{ stable.site }}"
          - --url
          - "{{ stable.url }}"
      changed_when: false

    - name: Confirm target image exists locally
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ target.image }}"]
      changed_when: false
      register: target_image_inspect

    - name: Deploy and validate target, otherwise restore stable image
      block:
        - name: Set candidate image tag in Staging config
          ansible.builtin.lineinfile:
            path: "{{ staging_env }}"
            regexp: '^CUSTOM_TAG='
            line: "CUSTOM_TAG={{ target.image.rsplit(':', 1)[1] }}"
            mode: '0600'
          no_log: true

        - name: Run configurator with candidate image
          ansible.builtin.command:
            argv: "{{ compose_base + ['up', '-d', '--no-deps', '--pull', 'never', 'configurator'] }}"
          args:
            chdir: "{{ docker_dir }}"
          when: target.image != stable.image

        - name: Confirm configurator finished successfully
          ansible.builtin.command:
            argv: [docker, wait, dacn-staging-configurator-1]
          register: config_finished
          changed_when: false
          failed_when: config_finished.stdout | trim != '0'
          when: target.image != stable.image

        - name: Deploy Frappe application containers
          ansible.builtin.command:
            argv: "{{ compose_base + ['up', '-d', '--no-deps', '--pull', 'never', 'backend', 'frontend', 'websocket', 'queue-short', 'queue-long', 'scheduler'] }}"
          args:
            chdir: "{{ docker_dir }}"

        - name: Validate candidate deployment
          ansible.builtin.command:
            argv:
              - python3
              - "{{ playbook_dir }}/../validate_deployment.py"
              - --expected-image
              - "{{ target.image }}"
              - --expected-digest
              - "{{ target.digest }}"
              - --site
              - "{{ target.site }}"
              - --url
              - "{{ target.url }}"
          register: deployed_check
          retries: 8
          delay: 5
          until: deployed_check.rc == 0
          changed_when: false

        - name: Optional fault injection for rollback demonstration
          ansible.builtin.fail:
            msg: "Simulated post-deployment check failure"
          when: simulate_failure | bool

        - name: Report accepted candidate
          ansible.builtin.debug:
            msg: "DEPLOYMENT ACCEPTED: {{ target.image }}"

      rescue:
        - name: Explain recovery attempt
          ansible.builtin.debug:
            msg: "Deployment rejected at {{ ansible_failed_task.name }}. Restoring last known good image."

        - name: Restore stable tag
          ansible.builtin.lineinfile:
            path: "{{ staging_env }}"
            regexp: '^CUSTOM_TAG='
            line: "CUSTOM_TAG={{ stable.image.rsplit(':', 1)[1] }}"
            mode: '0600'
          no_log: true

        - name: Restore configurator with stable image
          ansible.builtin.command:
            argv: "{{ compose_base + ['up', '-d', '--no-deps', '--pull', 'never', 'configurator'] }}"
          args:
            chdir: "{{ docker_dir }}"

        - name: Verify restored configurator completed
          ansible.builtin.command:
            argv: [docker, wait, dacn-staging-configurator-1]
          register: stable_configurator
          changed_when: false
          failed_when: stable_configurator.stdout | trim != '0'

        - name: Recreate Frappe containers with stable image
          ansible.builtin.command:
            argv: "{{ compose_base + ['up', '-d', '--no-deps', '--pull', 'never', 'backend', 'frontend', 'websocket', 'queue-short', 'queue-long', 'scheduler'] }}"
          args:
            chdir: "{{ docker_dir }}"

        - name: Verify restored stable version
          ansible.builtin.command:
            argv:
              - python3
              - "{{ playbook_dir }}/../validate_deployment.py"
              - --expected-image
              - "{{ stable.image }}"
              - --expected-digest
              - "{{ stable.digest }}"
              - --site
              - "{{ stable.site }}"
              - --url
              - "{{ stable.url }}"
          register: restored_check
          retries: 8
          delay: 5
          until: restored_check.rc == 0
          changed_when: false

        - name: Mark attempted deployment as failed after recovery
          ansible.builtin.fail:
            msg: "ROLLBACK VERIFIED; candidate deployment was rejected."
